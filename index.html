<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吃鸡搭子｜PUBG 队友匹配</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#10151b"><style>
:root{--bg:#10151b;--panel:#18212a;--panel2:#202c36;--text:#f3f6f8;--muted:#94a5b2;--accent:#f5b544;--green:#60d394;--line:#2d3b45}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#293a41 0,#10151b 40%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,select,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:800;font-size:24px;letter-spacing:-.5px}.brand span{color:var(--accent)}.badge{color:var(--green);font-size:13px}.panel{background:rgba(24,33,42,.9);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 70px #0004}.hero{display:flex;gap:28px;align-items:end;justify-content:space-between}.eyebrow{color:var(--accent);font-weight:700}.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.05;margin:8px 0 12px;max-width:650px}.hero p{color:var(--muted);max-width:590px;margin:0}.login{display:flex;gap:10px;flex-wrap:wrap;min-width:260px}.primary,.secondary{padding:12px 16px;border-radius:11px;font-weight:700}.primary{background:var(--accent);color:#211b0d}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.section{margin-top:18px}.section h2{font-size:19px;margin:0 0 12px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:10px 14px;border:1px solid var(--line);background:#141d24;color:var(--muted);border-radius:999px}.chip.active{background:#5a441f;color:#ffd77a;border-color:#b8842e}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}select,input{width:100%;background:#121a20;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.results{display:none}.results.show{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#141d24;border:1px solid var(--line);border-radius:14px;padding:17px}.person{display:flex;gap:12px;align-items:center}.avatar{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#d68532,#6f3e2d);font-weight:800}.name{font-weight:800}.meta{font-size:13px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tag{font-size:12px;color:#c9d6dd;background:#25323b;border-radius:999px;padding:5px 8px}.tag.good{color:#9df2bc;background:#193b2a}.room{display:none}.room.show{display:block}.roombar{display:flex;justify-content:space-between;gap:12px;align-items:center}.members{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.member{padding:14px;background:#141d24;border:1px solid var(--line);border-radius:12px}.voice{display:flex;align-items:center;gap:10px;color:var(--green);font-size:14px}.empty{color:var(--muted);padding:20px 0}.footer{color:#738491;font-size:12px;text-align:center;padding:22px}
@media(max-width:760px){.app{padding:14px}.hero{display:block}.login{margin-top:18px}.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.members{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header class="top"><div class="brand">吃鸡<span>搭子</span></div><div style="display:flex;align-items:center;gap:10px"><button id="install" class="secondary" style="display:none;padding:8px 11px;font-size:13px">安装 APP</button><div class="badge">● 模拟体验版</div></div></header>
<section class="panel"><div class="hero"><div><div class="eyebrow">PUBG 队友匹配</div><h1>按你想玩的方式，找到合拍的队友。</h1><p>刚枪、运营、上分或娱乐，先说清楚玩法，再一起开黑。</p></div><div class="login"><button class="secondary" onclick="login('微信')">微信登录</button><button class="primary" onclick="login('Steam')">Steam 登录</button></div></div>
<div class="section"><h2>你想怎么玩？</h2><div class="chips" id="play"><button class="chip active">刚枪</button><button class="chip">运营</button><button class="chip">稳健上分</button><button class="chip">娱乐聊天</button></div></div>
<div class="section filters"><div class="field"><label>想找的等级</label><select id="level"><option>200–500 级</option><option>100–300 级</option><option>500–800 级</option><option>不限等级</option></select></div><div class="field"><label>段位</label><select><option>不限段位</option><option>黄金以上</option><option>铂金以上</option><option>钻石以上</option></select></div><div class="field"><label>性别偏好</label><select><option>不限</option><option>男</option><option>女</option></select></div><div class="field"><label>模式</label><select><option>四排</option><option>双排</option></select></div></div><div class="actions"><button class="primary" onclick="match()">开始匹配</button><button class="secondary" onclick="alert('已保存为常用匹配条件')">保存条件</button></div></section>
<section class="panel results" id="results"><div class="roombar"><div><div class="eyebrow">匹配结果</div><h2 id="resultTitle">找到 3 位玩法相近的队友</h2></div><button class="secondary" onclick="match()">重新匹配</button></div><div class="cards" id="cards"></div></section>
<section class="panel room" id="room"><div class="roombar"><div><div class="eyebrow">临时队伍</div><h2 id="roomTitle">刚枪四排 · 语音房</h2></div><button class="secondary" onclick="leaveRoom()">退出队伍</button></div><div class="voice">● 语音房已连接 <span class="meta">点击下方麦克风可静音</span></div><div class="members"><div class="member"><div class="person"><div class="avatar">你</div><div><div class="name">你</div><div class="meta">队长 · 刚枪</div></div></div><button class="secondary mic" style="margin-top:12px;width:100%">🎙️ 麦克风开启</button></div><div class="member"><div class="person"><div class="avatar">林</div><div><div class="name">林间伏地魔</div><div class="meta">268 级 · 刚枪</div></div></div></div><div class="member"><div class="person"><div class="avatar">K</div><div><div class="name">Kimi_77</div><div class="meta">401 级 · 刚枪</div></div></div></div><div class="member"><div class="person"><div class="avatar">阿</div><div><div class="name">阿北不苟</div><div class="meta">322 级 · 刚枪</div></div></div></div></div><button class="primary" onclick="alert('已准备，等队友一起开始游戏')">准备开始</button></section><div class="footer">当前为模拟数据原型 · 微信 / Steam 登录和真实语音将在下一阶段接入</div></main>
<script>const users=[['林间伏地魔','林','268','黄金','男'],['Kimi_77','K','401','铂金','女'],['阿北不苟','阿','322','黄金','男'],['小满今天上分','满','477','铂金','女'],['落地就开团','落','215','白银','男'],['耳机已戴好','耳','356','黄金','女']];let chosen='刚枪';document.querySelectorAll('#play .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#play .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosen=b.textContent});function login(x){alert(x+'登录已模拟成功，可以直接开始匹配。')}function match(){if(window.API_BASE){fetch(window.API_BASE+"/match/queue",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({play:chosen,level:document.getElementById("level").value})}).catch(()=>{})}const c=document.getElementById('cards');c.innerHTML=users.slice(0,3).map(u=>`<article class="card"><div class="person"><div class="avatar">${u[1]}</div><div><div class="name">${u[0]}</div><div class="meta">${u[2]} 级 · ${u[3]} · ${u[4]}</div></div></div><div class="tags"><span class="tag good">${chosen}</span><span class="tag">🎙️ 开麦</span><span class="tag">Steam 已绑定</span></div><div class="meta">喜欢主动找人打团，晚上 8 点后常在线</div><button class="primary invite" style="width:100%;margin-top:14px">邀请组队</button></article>`).join('');document.getElementById('resultTitle').textContent=`找到 3 位“${chosen}”队友`;document.getElementById('results').classList.add('show');document.getElementById('roomTitle').textContent=`${chosen}四排 · 语音房`;document.getElementById('room').classList.remove('show');document.querySelectorAll('.invite').forEach(b=>b.onclick=()=>{document.getElementById('room').classList.add('show');document.getElementById('room').scrollIntoView({behavior:'smooth'})})}function leaveRoom(){document.getElementById('room').classList.remove('show')}document.addEventListener('click',e=>{if(e.target.classList.contains('mic')){e.target.textContent=e.target.textContent.includes('开启')?'🔇 麦克风已静音':'🎙️ 麦克风开启'}});let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").style.display="block"});document.getElementById("install").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")} </script></body></html>
